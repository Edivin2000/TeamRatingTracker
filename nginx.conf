server {
    listen 80;
    server_name atomgameblk.ru www.atomgameblk.ru;
    
    access_log /var/log/nginx/atomgameblk.access.log;
    error_log /var/log/nginx/atomgameblk.error.log;
    
    # Максимальный размер загружаемого файла
    client_max_body_size 10M;
    
    # Кеширование статических файлов
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg)$ {
        proxy_pass http://127.0.0.1:3000;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }
    
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Защита от распространенных уязвимостей
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        
        # Увеличиваем таймауты для долгих запросов
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
    
    # Перенаправление с www на без www
    if ($host = www.atomgameblk.ru) {
        return 301 http://atomgameblk.ru$request_uri;
    }
    
    # После настройки SSL, добавьте следующие блоки
    
    # Перенаправление с HTTP на HTTPS
    # if ($scheme != "https") {
    #     return 301 https://$host$request_uri;
    # }
    
    # Настройка HSTS для SSL
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
}